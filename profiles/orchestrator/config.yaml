display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
delegation:
  max_iterations: 250
  subagent_auto_approve: false
skills:
  creation_nudge_interval: 15
curator:
  enabled: false
approvals:
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
_config_version: 45
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
platform_toolsets:
  cli:
  - hermes-cli
  telegram:
  - hermes-telegram
  discord:
  - hermes-discord
  whatsapp:
  - hermes-whatsapp
  slack:
  - hermes-slack
  signal:
  - hermes-signal
  homeassistant:
  - hermes-homeassistant
  qqbot:
  - hermes-qqbot
  yuanbao:
  - hermes-yuanbao
  teams:
  - hermes-teams
  google_chat:
  - hermes-google_chat
provider_routing:
  sort: price
  data_collection: deny
terminal:
  timeout: 180
  lifetime_seconds: 300
